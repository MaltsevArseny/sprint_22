server:
  port: 8186

spring:
  application:
    name: delivery
  datasource:
    url: jdbc:h2:mem:delivery_db;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

delivery:
  base-cost: 5.0
