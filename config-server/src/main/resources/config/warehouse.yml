server:
  port: 8183

spring:
  application:
    name: warehouse
  datasource:
    url: jdbc:h2:mem:warehouse_db;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

warehouse:
  address:
    country: Russia
    city: Moscow
    street: ADDRESS_2
    house: "1"
    flat: "1"
