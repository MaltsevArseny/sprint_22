server:
  port: 8182

spring:
  application:
    name: shopping-cart
  datasource:
    url: jdbc:h2:mem:shopping_cart_db;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
