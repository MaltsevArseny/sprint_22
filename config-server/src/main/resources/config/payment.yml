server:
  port: 8185

spring:
  application:
    name: payment
  datasource:
    url: jdbc:h2:mem:payment_db;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

payment:
  vat-rate: 0.10
