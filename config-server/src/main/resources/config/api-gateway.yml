spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: shopping-store-route
          uri: lb://shopping-store
          predicates:
            - Path=/shopping-store/**
          filters:
            - StripPrefix=1
            - PrefixPath=/api/v1
        - id: shopping-cart-route
          uri: lb://shopping-cart
          predicates:
            - Path=/shopping-cart/**
          filters:
            - StripPrefix=1
            - PrefixPath=/api/v1
        - id: warehouse-route
          uri: lb://warehouse
          predicates:
            - Path=/warehouse/**
          filters:
            - StripPrefix=1
            - PrefixPath=/api/v1
        - id: order-route
          uri: lb://order
          predicates:
            - Path=/order/**
          filters:
            - StripPrefix=1
            - PrefixPath=/api/v1
        - id: payment-route
          uri: lb://payment
          predicates:
            - Path=/payment/**
          filters:
            - StripPrefix=1
            - PrefixPath=/api/v1
        - id: delivery-route
          uri: lb://delivery
          predicates:
            - Path=/delivery/**
          filters:
            - StripPrefix=1
            - PrefixPath=/api/v1
